name: MeshCentral Assistant

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build MeshCentral Assistant
        shell: powershell
        run: |
          msbuild meshcentralassistant.csproj `
            /p:Configuration=Release `
            /p:Platform="AnyCPU" `
            /p:GenerateAppxPackageOnBuild=false

      - name: Verify Build
        shell: powershell
        run: |
          $exe = ".\bin\Release\MeshCentralAssistant.exe"

          if (-not (Test-Path $exe)) {
              Write-Host "Build output not found!"
              Write-Host ""
              Write-Host "Contents of bin\Release:"
              
              if (Test-Path ".\bin\Release") {
                  Get-ChildItem ".\bin\Release" -Recurse |
                      Select-Object FullName, Length |
                      Format-Table -AutoSize
              }

              exit 1
          }

          Write-Host "Build successful!"
          Write-Host "EXE: $exe"
          Write-Host "Size: $((Get-Item $exe).Length) bytes"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshCentralAssistant
          path: |
            .\bin\Release\MeshCentralAssistant.exe
            .\bin\Release\MeshCentralAssistant.exe.config
            .\bin\Release\*.dll
          if-no-files-found: error
